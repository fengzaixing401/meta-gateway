name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Merge upstream master
        env:
          # GITHUB_TOKEN 永远没有 workflows 权限，无法推送 .github/workflows/* 的改动。
          # 因此使用仓库 secret SYNC_TOKEN（classic PAT，需 repo + workflow scope）。
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::warning::secret SYNC_TOKEN 未配置，本次若包含 .github/workflows/* 改动，推送会被拒绝"
          else
            echo "SYNC_TOKEN 已注入，长度 ${#SYNC_TOKEN}"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/ZiChuanLan/meta-gateway.git
          git fetch upstream master
          git checkout master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "already up to date with upstream, nothing to merge"
            exit 0
          fi

          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit upstream/master

          if [ -n "${SYNC_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git push origin master
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          echo "synced ${BEFORE} -> $(git rev-parse HEAD)"
